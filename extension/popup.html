<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>SuperBrain KIPAPP Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo" style="display:flex;align-items:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"></path></svg>
      </span>
      <div>
        <h3>SuperBrain Bridge</h3>
        <p>KIPAPP BPS Integrator</p>
      </div>
    </div>
    <span id="status-badge" class="badge badge-disconnected">Terputus</span>
  </div>

  <div class="user-card" id="user-info-section" style="display: none;">
    <div class="user-avatar" id="user-initial">YA</div>
    <div class="user-details">
      <div class="user-name" id="user-name">-</div>
      <div class="user-nip" id="user-nip">NIP: -</div>
    </div>
  </div>

  <div class="content">
    <div class="status-box" id="guide-box">
      <p style="display:flex;align-items:center;gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>
        <strong>Panduan Cepat:</strong>
      </p>
      <ol>
        <li>Buka <a href="https://kipapp.bps.go.id" target="_blank">kipapp.bps.go.id</a> dan login via SSO.</li>
        <li>Ekstensi ini otomatis menyinkronkan token autentikasi Anda.</li>
        <li>Buka <a href="https://superbrain-bps.vercel.app/ckp" target="_blank">SuperBrain CKP</a> untuk mulai pengiriman 1-klik!</li>
      </ol>
    </div>

    <div class="actions">
      <button id="btn-open-kipapp" class="btn btn-secondary">Buka KIPAPP BPS</button>
      <button id="btn-open-superbrain" class="btn btn-primary">Buka SuperBrain CKP</button>
    </div>

    <div class="footer-stats">
      <span>Sinkronisasi Terakhir: <strong id="last-sync-time">-</strong></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
